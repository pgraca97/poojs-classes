<!doctype html>
<html lang="pt">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />
    <title>SoundBase</title>
    <link
      rel="stylesheet"
      href="style.css"
    />
  </head>
  <body>
    <header>
      <h1 id="app-title">SoundBase</h1>
      <p id="track-count"></p>
    </header>

    <main>
      <section id="search-section">
        <input
          type="text"
          id="search-input"
          placeholder="Pesquisar…"
        />
      </section>
      <section id="genre-filters">
        <button
          class="btn-filter active"
          data-genre="all"
        >
          All
        </button>
        <button
          class="btn-filter"
          data-genre="Pop"
        >
          Pop
        </button>
        <button
          class="btn-filter"
          data-genre="Hip-Hop"
        >
          Hip-Hop
        </button>
        <button
          class="btn-filter"
          data-genre="Jazz"
        >
          Jazz
        </button>
        <button
          class="btn-filter"
          data-genre="Indie"
        >
          Indie
        </button>
        <button
          class="btn-filter"
          data-genre="R&B"
        >
          R&B
        </button>
      </section>

      <section id="catalogue-section">
        <div id="track-list"></div>
      </section>

      <section id="form-section">
        <h2>Adicionar faixa</h2>
        <form id="add-track-form">
          <label for="form-title">Título</label>
          <input
            type="text"
            id="form-title"
          />

          <label for="form-artist">Artista</label>
          <input
            type="text"
            id="form-artist"
          />

          <label for="form-duration">Duração (segundos)</label>
          <input
            type="number"
            id="form-duration"
            min="-10"
          />

          <label for="form-genre">Género</label>
          <input
            type="text"
            id="form-genre"
          />

          <button type="submit">Adicionar</button>
        </form>
      </section>
    </main>

    <script src="soundbase-dados.js"></script>
    <script src="script.js"></script>
  </body>
</html>
